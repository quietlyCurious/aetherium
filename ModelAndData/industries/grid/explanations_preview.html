<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Explanations Preview</title>
<style>
  :root{
    --bg:#f9f9f9; --card:#fff; --line:#ebebeb; --ink:#222; --ink2:#555; --muted:#8a8f96;
    --accent:#0078d4; --accent-soft:#e8f2ff; --ref:#4b5563; --peer:#c9ced6; --band:#eef0f3; --gap:#dbe9f8;
    --ok:#2f8f5b; --no:#9a3b3b; --pend:#8a6414;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.45 "Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,"Helvetica Neue",Arial,sans-serif}
  .app{display:grid;grid-template-columns:300px minmax(0,1fr);height:100%}
  @media (max-width:860px){.app{grid-template-columns:1fr;height:auto}.list{max-height:260px}}
  .list{background:#fff;border-right:1px solid var(--line);overflow:auto}
  .zone{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:12px 14px 6px}
  .it{padding:9px 14px;border-top:1px solid #f2f2f2;cursor:pointer;display:grid;grid-template-columns:10px 1fr;gap:8px}
  .it:hover{background:#fafbfc}
  .it.sel{background:var(--accent-soft)}
  .it .dot{width:9px;height:9px;border-radius:50%;margin-top:4px}
  .it .a{font-size:12px;color:var(--muted)}
  .it .s{font-size:12.5px}
  .it .m{font-size:11px;color:var(--muted);margin-top:2px}
  .main{overflow:auto;padding:14px 18px 30px}
  .col{max-width:980px;margin:0 auto}
  .ihead{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px}
  .ihead .dot{width:10px;height:10px;border-radius:50%;margin-top:6px;flex:none}
  .ihead .asset{font-size:12px;color:var(--muted)}
  .ihead .sig{font-size:16px;font-weight:600}
  .tabs{display:inline-flex;border:1px solid #cfd3d8;border-radius:4px;overflow:hidden;margin:4px 0 12px}
  .tabs span{padding:4px 12px;font-size:12px;color:var(--ink2);border-left:1px solid #cfd3d8}
  .tabs span:first-child{border-left:none}
  .tabs span.on{background:var(--accent);color:#fff}
  .card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:12px}
  .card h2{font-size:13px;margin:0 0 2px;font-weight:600}
  .card .sub{font-size:12px;color:var(--muted);margin:0 0 10px}
  .step{display:inline-flex;width:18px;height:18px;border-radius:50%;background:var(--accent-soft);color:#0055aa;font-size:11px;font-weight:600;align-items:center;justify-content:center;margin-right:6px}
  .verdict{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 18px;align-items:center}
  .verdict .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
  .verdict .big{font-size:15px;font-weight:600;margin:2px 0 4px}
  .stats{display:flex;gap:14px;flex-wrap:wrap}
  .stat{font-size:12px;color:var(--ink2)} .stat b{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:500}
  .conf{display:inline-flex;gap:3px;align-items:center;font-size:12px;color:var(--ink2)}
  .conf i{width:20px;height:6px;border-radius:3px;background:#e3e6ea;display:inline-block}
  .conf i.on{background:var(--ink2)}
  .conf span{margin-left:6px}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .chip{font-size:11px;padding:2px 8px;border-radius:10px;border:1px solid var(--line);background:#fafafa;color:var(--ink2)}
  .chip.det{background:var(--accent-soft);border-color:#cfe3fb;color:#0055aa}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin:0 0 6px}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .sw{width:16px;height:0;border-top:2px solid}
  .sw.dash{border-top-style:dashed}
  .sw.thin{border-top-width:1.5px}
  .sw.area{height:10px;border:none;border-radius:2px}
  .chart{position:relative;width:100%}
  .chart svg{display:block;width:100%;overflow:visible}
  .tip{position:absolute;pointer-events:none;background:#fff;border:1px solid #d9dce0;border-radius:6px;box-shadow:0 2px 8px rgba(0,0,0,.08);padding:6px 8px;font-size:12px;white-space:nowrap;display:none;z-index:5}
  .tip .t{font-weight:600;margin-bottom:2px}
  .tip .r{display:flex;gap:10px;justify-content:space-between}
  .tip .r em{font-style:normal;color:var(--ink2)}
  .axis text{fill:var(--muted);font-size:11px}
  .gl{stroke:#f0f1f3}
  .tally{display:flex;gap:16px;font-size:12px;color:var(--ink2);margin:-2px 0 4px}
  .ind{display:grid;grid-template-columns:22px minmax(0,1fr) 150px;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
  .ind:first-of-type{border-top:none}
  .ic{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff}
  .ic.match{background:var(--ok)} .ic.nomatch{background:#b9bec5} .ic.pending{background:#fff;color:var(--pend);border:1.5px dashed #c9a34a}
  .ind .ttl{font-weight:600}
  .ind .val{font-variant-numeric:tabular-nums}
  .ind .why{color:var(--muted);font-size:12px;margin-top:2px}
  .kind{font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-left:6px;font-weight:500}
  .spark svg{width:150px;height:40px;display:block}
  @media (max-width:640px){.ind{grid-template-columns:22px minmax(0,1fr)}.spark{grid-column:2}}
  .refs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
  @media (max-width:900px){.refs{grid-template-columns:1fr}}
  .ref{border:1px solid var(--line);border-radius:8px;padding:10px;background:#fcfcfd;display:flex;flex-direction:column}
  .ref.best{border-color:#9cc7ef;box-shadow:0 0 0 1px #9cc7ef inset}
  .ref .rt{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
  .ref .rt b{font-size:12px}
  .ref .tag{font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);white-space:nowrap}
  .ref .desc{font-size:12px;color:var(--ink2);margin:4px 0 6px;min-height:52px}
  .ref .ct{font-size:11px;color:var(--muted);margin-top:4px}
  .ref .cmp{font-size:12px;margin-top:auto;padding-top:6px;border-top:1px dashed var(--line)}
  .ref .cmp .m{font-weight:600}
  .ref .cmp .m.match{color:var(--ok)} .ref .cmp .m.nomatch{color:var(--no)} .ref .cmp .m.partial{color:var(--pend)}
  .ref ul{margin:4px 0 0;padding-left:16px;color:var(--ink2);font-size:12px}
  .two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
  .two.flat>div:first-child{display:none}
  .two.flat>div:last-child{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;align-items:start}
  @media (max-width:900px){.two,.two.flat>div:last-child{grid-template-columns:1fr}}
  .ro{padding:8px 0;border-top:1px solid var(--line)}
  .ro:first-of-type{border-top:none;padding-top:0}
  .ro .q{font-weight:600;display:flex;gap:6px;align-items:baseline}
  .ro .q .x{font-size:11px;color:var(--muted);font-weight:500;border:1px solid var(--line);border-radius:10px;padding:0 6px}
  .ro .a{color:var(--ink2);font-size:12px;margin-top:2px}
  .note{font-size:12px;color:var(--muted);background:#fafafa;border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin-top:8px}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:12px}
  .kv dt{color:var(--muted)} .kv dd{margin:0}
  .up{color:var(--ok)!important} .down{color:var(--no)!important}
  .work{border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin-top:8px;font-size:12px}
  .work b{display:block}
  .aipill{font-size:10px;font-weight:600;color:#6a3fd6;background:#f1ecff;border-radius:8px;padding:1px 6px;margin-left:4px}
  .btnrow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .btn{font:inherit;font-size:12px;border:1px solid #cfd3d8;background:#fff;border-radius:4px;padding:5px 10px}
  .btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
  details.eng{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 16px}
  details.eng summary{cursor:pointer;font-weight:600}
  details.eng summary span{font-weight:400;color:var(--muted);margin-left:6px}
  .pipe{display:flex;align-items:stretch;flex-wrap:wrap;gap:6px 0;margin:12px 0}
  .blk{border:1px solid #d6dbe1;border-radius:6px;padding:8px 10px;background:#fbfcfd;width:170px;font-size:12px}
  .blk b{display:block;margin-bottom:2px}
  .arr{align-self:center;color:#aab0b8;padding:0 6px}
  .run{font-size:12px;color:var(--ink2);margin:6px 0 10px}
  pre{background:#f6f8fa;border:1px solid var(--line);border-radius:6px;padding:10px 12px;font-size:11.5px;line-height:1.45;overflow:auto;max-height:380px}
  .foot{font-size:11px;color:var(--muted);margin:14px 0 4px;text-align:center}
</style>
</head>

sing rate with thermal gases and no acetylene → thermal fault; the lab resample confirms"}],"definition":{"appliesTo":{"assetType":"dga_monitor"},"inputs":{"rate":"self.dga_tdcg_rate_ppm_day","tdcg":"self.dga_tdcg_ppm","h2":"self.dga_h2_ppm","c2h4":"self.dga_c2h4_ppm","c2h2":"self.dga_c2h2_ppm","moisture":"self.moisture_rel_sat_pct","load":"parent[transformer].xfmr_loading_pct","ltc":"sibling[oltc].ltc_tank_diff_temp_c"},"peers":{"same":"assetType","use":"the other DGA monitors, to show the rise isn't a site-wide effect"},"expected":{"model":"own baseline","target":"rate","formula":"mean(rate) over the first baseline_min"},"params":{"baseline_min":60,"ratio":2.0,"rise_ppm_day":1.5,"sustain_min":60,"slope_window_min":120,"min_slope_ppm_day_h":0.5,"h2_rise_ppm":10.0,"c2h4_rise_ppm":5.0,"c2h2_max_rise_ppm":0.5,"moisture_band_pct":1.0,"peer_ratio":1.5,"action_ppm_day":30.0,"ltc_band_c":2.0},"checks":[{"id":"rate","role":"required","rule":"rate > ratio × baseline and rate − baseline > rise_ppm_day"},{"id":"rising","role":"required","rule":"slope(rate, slope_window_min) > min_slope_ppm_day_h"},{"id":"sustained","role":"required","rule":"rate check held for sustain_min"},{"id":"gases","role":"supporting","independent":true,"rule":"H2 up > h2_rise_ppm and C2H4 up > c2h4_rise_ppm"},{"id":"noarc","role":"supporting","rule":"C2H2 within c2h2_max_rise_ppm of its baseline"},{"id":"moisture","role":"supporting","rule":"moisture within ±moisture_band_pct of its baseline"},{"id":"peers","role":"supporting","rule":"every other monitor's rate below peer_ratio × its own baseline"}],"ruleOut":["arcing","higher load","tap changer oil leaking into the main tank","monitor error"],"confidence":{"low":"required checks only","medium":"individual gases confirm it","high":"a laboratory sample confirms the rate"},"references":["textbook: overheated joint (thermal fault)","variant: arcing","look-alike: monitor drift"]},"run":{"evaluated":11,"fired":[{"assetId":"VESPER_KESSLER_T2_XFMR_DGA","label nitored evolution as unpredictable: documented cases run from ten days of warning down to minutes.","evidence":[0.376,0.507,0.632,0.759,0.886,0.956],"evidencePoints":[{"time":"09:30","value":"0.376 %","label":"Baseline"},{"time":"10:30","value":"0.507 %","label":""},{"time":"11:30","value":"0.632 %","label":""},{"time":"12:30","value":"0.759 %","label":"Doubled from baseline"},{"time":"13:30","value":"0.886 %","label":"Doble scheduled"},{"time":"14:05","value":"0.956 %","label":"Now"}],"relatedOccurrences":[{"date":"2026-03-18","summary":"Wyndham T1 C-phase bushing replaced after a similar power factor trend; core found wet at teardown."}],"whatChangedSummary":"Bushing monitor alerts at 09:30 and 12:30; no switching or load change on T1.","whatChanged":[{"time":"09:30","source":"Alarm","description":"Bushing monitor first-stage alert on A-phase C1 power factor","related":true},{"time":"12:30","source":"Alarm","description":"Second-stage alert: power factor doubled from baseline","related":true},{"time":"13:30","source":"Maintenance","description":"Doble test added to the Saturday outage request","related":true}],"confidence":"Three independent bushing measurements agree","confidenceLevel":"high","risk":"High — bushing failure takes the transformer and can damage adjacent plant","riskLevel":"high","expectedOutcome":"Power factor continues to rise until the bushing is replaced.","outcomeStatus":"none"}},{"id":"GSIT02","assetId":"VESPER_KESSLER_T2_XFMR_DGA","unitId":"VESPER_KESSLER","primaryProperty":"dga_tdcg_rate_ppm_day","asset":"Kessler · T2 Transformer · Autotransformer · DGA Monitor","line":"Kessler","severity":"medium","signal":"Kessler T2 combustible gas rate creeping up","aiInterpretation":"TDCG rate of change has climbed from 1.77 ppm/day at 08:10 to 9.02 ppm/day, with ethylene and hydrogen rising together and acetylene flat. That gas pattern is thermal, not arcing.","since":"5h 55m ago","sinceMinutes":355,"attentionState":"investigate","detail":{"signal":"TD  Line","line":"Orrin","severity":"high","signal":"Orrin–Larkspur 138 kV locked out after a failed reclose","aiInterpretation":"A single-phase-to-ground fault at 10:15 tripped both ends. The one reclose attempt failed and the lockout relay operated, so the circuit is out of service and out of the contingency set. Line patrol is en route.","since":"3h 50m ago","sinceMinutes":230,"attentionState":"act","detail":{"signal":"Flow went from 56.2 MW to zero in one scan at 10:15. The breaker operations counter stepped by 2, the reclose counter by 1, and accumulated interrupted energy by 3.84 kA²s.","observed":"Both ends open and locked out since 10:20. Every 138 kV bus registered a voltage dip in the same scan — 0.063 pu at Orrin, 0.058 pu at Larkspur, 0.018 pu at Aldergate — and all recovered on fault clearing.","derived":"Sag depth falls off with electrical distance from the fault and every bus saw it simultaneously, which is consistent with a fault on this circuit rather than a local problem at either station.","inferred":"A permanent fault. Most transmission faults are temporary and clear on the first reclose; this one did not, so there is something physically on the line.","recommendation":"Patrol between structures 41 and 78 first, where the fault locator puts it. Hold the restricted configuration until the circuit is back: the binding contingency is now the Wyndham–Larkspur circuit, not this one.","evidence":[55.2,56.2,0.0,0.0,0.0,0.0],"evidencePoints":[{"time":"10:00","value":"55.2 MW","label":""},{"time":"10:10","value":"56.2 MW","label":"Pre-fault"},{"time":"10:15","value":"0.0 MW","label":"Fault and trip"},{"time":"10:20","value":"0.0 MW","label":"Reclose failed — lockout"},{"time":"11:00","value":"0.0 MW","label":""},{"time":"14:05","value":"0.0 MW","label":"Still out"}],"relatedOccurrences":[{"date":"2026-07-02","summary":"Same circuit tripped and reclosed successfully during a storm cell."}],"whatChangedSummary":"Circuit tripped, reclosed unsuccessfully and locked out; configuration restricted since.","whatChanged":[{"time":"10:15","source":"Event","description":"A-phase to ground fault, both ends tripped","related":true},{"time":"10:20","source":"Event","description":"Reclose attempt unsuccessful — 86 lockout operated","related":true},{"time":"10:35","source":"Operator Action","description":"Restricted configuration declared for Harrow District","related":true},{"time":"11:05","source":"Field Check","description":"Line patrol dispatched to structures 41–78","related":true}],"confidence":"Confirmed by relay event report and fault locator","confidenceLevel":"high","risk":"High — the network is running on one path where it had two","riskLevel":"high","expectedOutcome":"Circuit restored once the patrol finds and clears the cause.","outcomeStatus":"none"}},{"id":"GSIT06","assetId":"VESPER_LARKSPUR","unitId":"VESPER_LARKSPUR","primaryProperty":"worst_post_ctg_loading_pct","asset":"Larkspur","line":"Larkspur","severity":"high","signal":"Larkspur exposed on the next contingency","aiInterpretation":"With Orrin–Larkspur out, the flow it carried is arriving the long way round. Larkspur’s worst post-contingency loading crossed 100 % of emergency rating at 10:35 and peaked at 105.1 % at 11:20. Closing the Navarre–Dunmore tie pulled it back under, but the margin is gone.","since":"3h 50m ago","sinceMinutes":230,"attentionState":"act","detail":{"signal":"Worst N-1 post-contingency loading peaked at 105.1 % of emergency rating at 11:20 and is 98.6 % now. Pre-contingency loading peaked at 86.0 % — nothing is actually overloaded.","observed":"Wyndham–Larkspur went from 105.5 MW to 140.7 MW and Larkspur–Wexford from 30.5 MW to 48.1 MW within three scans of the lockout. Larkspur T1 rose from 36.0 MVA to 61.9 MVA. Closing the 69 kV tie at 11:20 moved 11.2 MW to Navarre and took T1 back to 51.7 MVA.","derived":"The binding contingency is now loss of Wyndham–Larkspur, which would put Larkspur T1 and the Larkspur–Wexford circuit above their emergency ratings. Closing the tie transferred load but also put 8.1 MVA onto Bexhill T1, whose own worst case is now 97.3 % — the exposure moved rather than disappearing.","inferred":"This is redistribution, not a fault: flow divides by impedance, and the 138 kV network was never sized to carry what the lost circuit was carrying.","recommendation":"Hold the restricted configuration and keep the tie closed until Orrin–Larkspur is back. Defer any switching in Harrow District that would take a second element out. Watch Bexhill T1, which is now the second most exposed element.","evidence":[51.3,78.7,103.6,105.1,87.9,93.9,98.6],"evidencePoints":[{"time":"10:10","value":"51.3 %","label":"Before the lockout"},{"time":"10:20","value":"78.7 %","label":"Flow redistributed"},{"time":"11:05","value":"103.6 %","label":"Above 100 %"},{"time":"11:20","value":"105.1 %","label":"Tie closed"},{"time":"11:40","value":"87.9 %","label":""},{"time":"13:00","value":"93.9 %","label":""},{"time":"14:05","value":"98.6 %","label":"Now"}],"relatedOccurrences":[{"date":"2026-08-11","summary":"Same circuit out for planned work; the tie was closed then too, with the same transfer to Bexhill."}],"whatChangedSummary":"Tie closed at 11:20 to relieve Larkspur T1; exposure partly transferred to Bexhill.","whatChanged":[{"time":"10:15","source":"Event","description":"Orrin–Larkspur 138 kV lockout — flow redistributed","related":true},{"time":"10:35","source":"Alarm","description":"Worst post-contingency loading crossed 100 % of emergency rating","related":true},{"time":"11:20","source":"Operator Action","description":"Closed the normally-open Navarre–Dunmore 69 kV tie","related":true},{"time":"11:40","source":"Event","description":"Bexhill T1 loading up 8.1 MVA as a result of the transfer","related":true}],"confidence":"Confirmed by contingency analysis and measured flows","confidenceLevel":"high","risk":"High — no margin for a second element loss in Harrow District","riskLevel":"high","expectedOutcome":"Margin returns when Orrin–Larkspur is restored.","outcomeStatus":"recovering"}},{"id":"GSIT07","assetId":"VESPER_DUNMORE_BUS69","unitId":"VESPER_DUNMORE","primaryProperty":"bus_voltage_pu","asset":"Dunmore · 69 kV Bus","line":"Dunmore","severity":"medium","signal":"Dunmore 69 kV bus voltage sagged — cause was two stations away","aiInterpretation":"Dunmore’s 69 kV bus fell to 0.943 pu, below the 0.95 pu pre-contingency floor. Nothing at Dunmore changed: the Wyndham 138 kV capacitor bank tripped on neutral unbalance at 09:40, and Dunmore is the electrically weakest point behind it.","since":"Resolved 3h 30m ago","sinceMinutes":210,"attentionState":"watch","detail":{"signal":"Bus voltage 1.007 pu → 0.943 pu at its lowest, against a 0.95 pu pre-contingency floor. Recovered to 0.977 pu after the tap change at 10:35 and is 0.984 pu now.","observed":"Wyndham capacitor bank neutral unbalance current stepped from 0.144 A to 1.314 A at 09:40 and stayed there; the bank went out in the same scan. Dunmore sagged 0.064 pu, Larkspur 69 kV 0.044 pu, and Wyndham’s own 138 kV bus only 0.018 pu.","derived":"The deepest sag is furthest from the cause, which is normal for a reactive loss: voltage falls where the network is weakest, not where the equipment failed. A step in neutral unbalance that does not return is a failed capacitor can and its fuse, not a measurement drift.","inferred":"One capacitor can failed and its fuse operated, unbalancing the bank enough to trip it. The next failure in the same phase group will come sooner than this one did.","recommendation":"Larkspur and Colvin taps were raised two steps at 10:35 as the interim fix. Inspect the bank, find the failed can, and re-baseline the inherent unbalance before returning it. Until then Wyndham and Thorne are short of reactive reserve.","evidence":[1.007,0.945,0.945,0.943,0.955,0.988,0.984],"evidencePoints":[{"time":"09:35","value":"1.007 pu","label":"Normal"},{"time":"09:40","value":"0.945 pu","label":"Cap bank trips"},{"time":"10:05","value":"0.945 pu","label":""},{"time":"10:25","value":"0.943 pu","label":"Lowest point"},{"time":"10:40","value":"0.955 pu","label":"Taps raised"},{"time":"11:00","value":"0.988 pu","label":""},{"time":"14:05","value":"0.984 pu","label":"Now"}],"relatedOccurrences":[{"date":"2025-09-30","summary":"Same bank lost a can; the unbalance step was about the same size."}],"whatChangedSummary":"Wyndham capacitor bank tripped on neutral unbalance; taps raised to recover 69 kV voltage.","whatChanged":[{"time":"09:40","source":"Event","description":"Wyndham 138 kV capacitor bank tripped on neutral unbalance","related":true},{"time":"09:55","source":"Alarm","description":"Dunmore 69 kV undervoltage advisory","related":true},{"time":"10:35","source":"Operator Action","description":"Raised Larkspur and Colvin tap positions two steps","related":true}],"confidence":"Confirmed by the timing of the unbalance step","confidenceLevel":"high","risk":"Low — voltage recovered, but the bank is out and reserve is thin","riskLevel":"low","expectedOutcome":"Voltage holds with the raised taps until the bank is repaired.","outcomeStatus":"resolved"}},{"id":"GSIT08","assetId":"VESPER_WEXFORD_BAY_TILBURY69_CB","unitId":"VESPER_WEXFORD","primaryProperty":"reclose_ops_count","asset":"Wexford · Tilbury 69 kV Line · Circuit Breaker","line":"Wexford","severity":"low","signal":"Five momentary faults on Wexford–Tilbury 69 kV this shift","aiInterpretation":"The circuit auto-reclosed successfully five times between 08:25 and 12:00. No customer was interrupted and no single event was worth an alarm, but the pattern is well above this circuit’s normal rate and the breaker has been accumulating wear.","since":"Resolved 1h 45m ago","sinceMinutes":105,"attentionState":"watch","detail":{"signal":"Reclose counter 10 against 5 at the start of shift — events at 08:25, 09:15, 10:05, 11:10 and 12:00. Accumulated interrupted energy is up 2.10 kA²s and contact wear up 1.8 points over the same period.","observed":"Each event is a successful reclose within a second; Tilbury 69 kV registered a 0.043 pu dip at each one and Wexford 0.028 pu. Nothing since the 12:20 patrol.","derived":"Five momentaries in under four hours against a normal rate of about one a week. Momentary outages last under a minute by definition, which is why none of them reached the outage log.","inferred":"Something intermittent on the line — vegetation or wildlife. Repeated temporary faults on one circuit usually become a permanent one.","recommendation":"The patrol found and cleared a limb contacting the B phase near structure 22 at 12:20. Keep the circuit on watch to end of shift and raise a vegetation work order for the span.","evidence":[5.0,6.0,7.0,8.0,9.0,10.0,10.0],"evidencePoints":[{"time":"08:10","value":"5","label":"Baseline"},{"time":"08:25","value":"6","label":"First event"},{"time":"09:15","value":"7","label":""},{"time":"10:05","value":"8","label":""},{"time":"11:10","value":"9","label":""},{"time":"12:00","value":"10","label":"Fifth"},{"time":"14:05","value":"10","label":"Quiet since patrol"}],"relatedOccurrences":[{"date":"2026-06-27","summary":"Same span produced three momentaries before a limb was removed."}],"whatChangedSummary":"Line patrol cleared a limb at structure 22 at 12:20; no events since.","whatChanged":[{"time":"08:25","source":"Event","description":"First successful auto-reclose","related":true},{"time":"11:10","source":"Event","description":"Fourth event — pattern escalated to a work order","related":true},{"time":"12:20","source":"Maintenance","description":"Patrol cleared vegetation contact at structure 22","related":true}],"confidence":"Confirmed by patrol","confidenceLevel":"high","risk":"Low — caught before it became a permanent fault","riskLevel":"low","expectedOutcome":"No further events; the span is added to the vegetation plan.","outcomeStatus":"resolved"}},{"id":"GSIT09","assetId":"VESPER_KESSLER_T1_XFMR","unitId":"VESPER_KESSLER","primaryProperty":"winding_hotspot_temp_c","asset":"Kessler · T1 Transformer · Autotransformer","line":"Kessler","severity":"high","signal":"Kessler T1 winding hot spot climbing on the afternoon ramp","aiInterpretation":"Hot spot rose from 73.7 °C at 10:20 to 107.9 °C at 12:50 as ambient and load climbed together. All twelve fans were already running, and T1 was carrying 54 MVA more than T2 — the two banks were not sharing the extra load evenly.","since":"Resolved 1h 15m ago","sinceMinutes":75,"attentionState":"watch","detail":{"signal":"Winding hot spot 73.7 °C → 107.9 °C between 10:20 and 12:50, past the 105 °C alert at 12:35 and against a 110 °C continuous limit for a 65 °C rise unit. Loading peaked at 93.9 % of nameplate with ambient at 32.1 °C. It is 99.4 °C now.","observed":"All cooling stages ran from the start of the ramp and top oil followed the hot spot at the expected gradient, so the cooling was working — there simply was not any more of it. T1 was at 140.8 MVA against T2’s 87.1 MVA at 12:45 on identical 150 MVA banks.","derived":"Hot spot tracked the value calculated from load and ambient within 2 °C throughout, which rules out a cooling fault and confirms genuine overload. Aging roughly doubles for every 6 °C above the design point, so the excursion costs real life even though nothing tripped.","inferred":"Load plus ambient, made worse by unequal sharing between the paralleled banks. The redistributed flow after the Orrin–Larkspur lockout put more through Kessler than the day would otherwise have done, and the tap mismatch sent most of it to T1.","recommendation":"Taps were rebalanced at 12:50 and both banks now sit near 116.6 MVA, with the hot spot back under 100 °C. Keep them matched until ambient drops, and check the paralleling settings before the morning ramp rather than during it.","evidence":[73.7,84.7,105.3,107.9,102.0,98.9,99.4],"evidencePoints":[{"time":"10:20","value":"73.7 °C","label":"Ramp starts"},{"time":"11:20","value":"84.7 °C","label":""},{"time":"12:35","value":"105.3 °C","label":"105 °C alert"},{"time":"12:50","value":"107.9 °C","label":"Peak"},{"time":"13:10","value":"102.0 °C","label":"Recovering"},{"time":"13:40","value":"98.9 °C","label":""},{"time":"14:05","value":"99.4 °C","label":"Now"}],"relatedOccurrences":[{"date":"2026-07-19","summary":"T1 reached 106 °C on the July peak day; same mitigation used."}],"whatChangedSummary":"Tap positions rebalanced at 12:50; the banks now share evenly and the hot spot is falling.","whatChanged":[{"time":"10:20","source":"Event","description":"Load and hot spot rise began with the redistribution","related":true},{"time":"12:35","source":"Alarm","description":"Winding temperature alert at 105 °C","related":true},{"time":"12:50","source":"Operator Action","description":"Rebalanced T1/T2 tap positions — 24 MVA moved to T2","related":true}],"confidence":"Confirmed against the calculated hot spot","confidenceLevel":"high","risk":"Medium — brief excursion, small loss of life, no damage","riskLevel":"medium","expectedOutcome":"Hot spot stays below 100 °C through the evening peak with the banks matched.","outcomeStatus":"resolved"}},{"id":"GSIT10","assetId":"VESPER_THORNE","unitId":"VESPER_THORNE","primaryProperty":"mvar_reserve_mvar","asset":"Thorne","line":"Thorne","severity":"medium","signal":"Thorne reactive reserve nearly gone while MW flows look comfortable","aiInterpretation":"Thorne’s 345 kV circuits are at 57 % and 34 % of normal rating and nothing on the MW display looks wrong. The reactive reserve behind those flows has fallen from 168.5 MVAr to 38.2 MVAr — the Wyndham bank is out and the shunt reactor is now committed.","since":"2h 25m ago","sinceMinutes":145,"attentionState":"investigate","detail":{"signal":"Reactive reserve 38.2 MVAr against a 120 MVAr operating target and 168.5 MVAr this morning. It stepped down 52 MVAr when the Wyndham bank tripped at 09:40 and slid a further 73 MVAr between 11:10 and 11:40. MW loading is unchanged.","observed":"Wyndham’s 50 MVAr capacitor bank has been out since 09:40, taking Wyndham’s own reserve from 161.2 MVAr to 109.9 MVAr as well. Thorne’s switchable reactive fell a further 41 MVAr as the reactor was committed to holding 345 kV voltage through the ramp.","derived":"Real power headroom and reactive headroom are not the same headroom. The loading percentage everyone watches says there is plenty of room; the reactive reserve says the next voltage event has almost nothing left to answer it with.","inferred":"Not a fault. The reserve was consumed by the capacitor bank outage and the afternoon ramp, and no single display shows both halves of it.","recommendation":"Restore the Wyndham bank as the first priority — it is worth more here than any redispatch. Until then, treat a voltage event in Keldon or Harrow as unbacked, and pre-position the Thorne reactor out of service rather than in.","evidence":[168.5,113.0,110.6,75.5,35.0,38.2],"evidencePoints":[{"time":"09:35","value":"168.5 MVAr","label":"Normal"},{"time":"09:45","value":"113.0 MVAr","label":"Capacitor bank lost"},{"time":"11:10","value":"110.6 MVAr","label":""},{"time":"11:25","value":"75.5 MVAr","label":"Reactor committed"},{"time":"11:40","value":"35.0 MVAr","label":"Below target"},{"time":"14:05","value":"38.2 MVAr","label":"Now"}],"relatedOccurrences":[],"whatChangedSummary":"Capacitor bank outage plus the afternoon ramp consumed the reserve; MW flows unchanged.","whatChanged":[{"time":"09:40","source":"Event","description":"Wyndham capacitor bank out — 50 MVAr of support lost","related":true},{"time":"11:40","source":"Alarm","description":"Reactive reserve fell below the 120 MVAr operating target","related":true}],"confidence":"Derived from reactive plant status, not measured directly","confidenceLevel":"medium","risk":"Medium — nothing is wrong now, and little is available if it goes wrong","riskLevel":"medium","expectedOutcome":"Reserve recovers when the Wyndham bank returns.","outcomeStatus":"none"}},{"id":"GSIT11","assetId":"VESPER_COLVIN_BUS69","unitId":"VESPER_COLVIN","primaryProperty":"bus_voltage_thd_pct","asset":"Colvin · 69 kV Bus","line":"Colvin","severity":"low","signal":"Colvin 69 kV voltage distortion drifting toward the limit","aiInterpretation":"Total harmonic distortion on the Colvin 69 kV bus has drifted from 0.97 % to 2.05 % through the day while voltage, flows and every equipment temperature stayed normal. The IEEE 519 limit for this voltage class is 2.5 %.","since":"5h 0m ago","sinceMinutes":300,"attentionState":"investigate","detail":{"signal":"Bus THD 2.05 % against a 2.5 % limit for 69 kV, up from 0.97 % at 09:05. Negative sequence voltage has risen 0.43 points over the same window, and Tilbury one circuit away is up 0.56 points.","observed":"Distortion rising steadily at Colvin and, more weakly, at Tilbury. Bus voltage, MW and MVAr flows and transformer temperatures are all normal.","derived":"The rise tracks the load ramp, and the distortion is worse closer to Colvin, so the source is downstream of Colvin rather than on the 138 kV system.","inferred":"A customer drive load that has come on and is running without its filter bank. Not confirmed with the customer yet.","recommendation":"Put a power quality recorder on the Colvin 69 kV bus before the evening peak and contact the customer about filter status. If it reaches 2.5 % the limit is absolute regardless of who caused it.","evidence":[0.97,1.16,1.33,1.65,1.73,2.05],"evidencePoints":[{"time":"09:05","value":"0.97 %","label":"Baseline"},{"time":"10:05","value":"1.16 %","label":""},{"time":"11:05","value":"1.33 %","label":"Halfway to limit"},{"time":"12:05","value":"1.65 %","label":""},{"time":"13:05","value":"1.73 %","label":"Still rising"},{"time":"14:05","value":"2.05 %","label":"Now"}],"relatedOccurrences":[{"date":"2026-04-15","summary":"Colvin reached 2.3 % during a customer commissioning test."}],"whatChangedSummary":"Nothing switched; distortion has simply tracked upward with load since 09:05.","whatChanged":[{"time":"09:05","source":"Event","description":"Power quality advisory raised on the Colvin 69 kV bus","related":true},{"time":"13:05","source":"Event","description":"Distortion passed 2.0 %, still below the limit","related":true}],"confidence":"Source inferred from the distortion gradient, not confirmed","confidenceLevel":"medium","risk":"Medium — the limit is absolute and the evening peak is still ahead","riskLevel":"medium","expectedOutcome":"Distortion keeps rising with load unless the filter bank is returned.","outcomeStatus":"none"}},{"id":"GSIT12","assetId":"VESPER_HARROW","unitId":null,"primaryProperty":"worst_post_ctg_loading_pct","asset":"Harrow District","line":"Harrow District","severity":"medium","signal":"Bexhill T1 relay test clearance cannot be taken today","aiInterpretation":"The Bexhill T1 protection test is due on 31 August under its six-year interval and needs four hours. With Orrin–Larkspur still out, taking T1 out of service would put Harrow District above 100 % post contingency — and there are under four hours of switching window left.","since":"25m ago","sinceMinutes":25,"attentionState":"investigate","detail":{"signal":"District worst post-contingency loading 98.6 % with T1 in service. The study with T1 out returns 118 % on the Bexhill–Orrin circuit. Time needed 4h 00m; time left in the switching window 3h 55m.","observed":"The clearance request was reviewed at 13:40 and the contingency study run at 13:50. Both the margin and the clock fail.","derived":"Time needed exceeds time left even before the contingency result, so this is a scheduling problem first and a reliability problem second. The compliance date is still three days out.","inferred":"Not an equipment problem at all — a plan that assumed the network would be intact.","recommendation":"Defer the clearance to Saturday and pair it with the Aldergate T1 bushing Doble test, which needs the same crew. If Orrin–Larkspur is not back by Friday, escalate the compliance date rather than taking the element out.","evidence":[97.2,97.5,97.3,97.5,98.3,98.6],"evidencePoints":[{"time":"13:40","value":"97.2 %","label":"Clearance reviewed"},{"time":"13:45","value":"97.5 %","label":""},{"time":"13:50","value":"97.3 %","label":"Contingency checked"},{"time":"13:55","value":"97.5 %","label":""},{"time":"14:00","value":"98.3 %","label":""},{"time":"14:05","value":"98.6 %","label":"Now"}],"relatedOccurrences":[],"whatChangedSummary":"Clearance reviewed against the current configuration and deferred.","whatChanged":[{"time":"13:40","source":"Documentation","description":"Bexhill T1 clearance request reviewed for today","related":true},{"time":"13:50","source":"Event","description":"Contingency study with T1 out returned 118 % on Bexhill–Orrin","related":true}],"confidence":"Confirmed by the contingency study","confidenceLevel":"high","risk":"Medium — the compliance date is 31 August, three days out","riskLevel":"medium","expectedOutcome":"Clearance rescheduled to Saturday with the network intact.","outcomeStatus":"none"}}],"work":[{"id":"wk-g01","text":"Shift turnover and outage log review","description":"Review open clearances, elements out of service and the overnight outage log with the outgoing transmission operator.","assetId":"VESPER","assetLabel":"Vesper Grid","workType":"HUDDLE","priority":"routine","sourceType":"planned","sourceLabel":null,"source":"operator","assignedRole":"Operator","plannedStart":"2026-08-28T08:00:00","dueAt":"2026-08-28T08:20:00","estimatedDurationMinutes":20,"done":true,"completedAt":"2026-08-28T08:18:00","createdAt":"2026-08-28T08:00:00"},{"id":"wk-g02","text":"Same-day load forecast review","description":"Compare the same-day forecast against actual demand and the ambient trend; confirm the evening peak assumption still holds.","assetId":"VESPER","assetLabel":"Vesper Grid","workType":"DOCUMENTATION","priority":"routine","sourceType":"planned","sourceLabel":null,"source":"operator","assignedRole":"Operator","plannedStart":"2026-08-28T08: // Fewest decimals that tell adjacent ticks apart (0.025 → 3); same rule as ExplanationChart.jsx.
function tickDecimals(t){ if(t.length<2) return 0; const st=Math.abs(t[1]-t[0]); for(let d=0;d<4;d++){ const x=st*Math.pow(10,d); if(Math.abs(x-Math.round(x))<1e-6) return d; } return 4; }
function niceTicks(lo,hi,count){
  const span=hi-lo; if(span<=0) return [lo];
  const raw=span/count, mag=Math.pow(10,Math.floor(Math.log10(raw)));
  const step=[1,2,2.5,5,10].map(k=>k*mag).find(s=>span/s<=count+0.5)||10*mag;
  const out=[]; for(let v=Math.ceil(lo/step-1e-9)*step; v<=hi+1e-9; v+=step) out.push(+v.toFixed(6)); return out;
}

  if(spec.band){let d='',pen=false;const lo=spec.band.lo,hi=spec.band.hi;const seg=[];let cur=[];

    seg.forEach(s=>{let d='';s.forEach((i,k)=>d+=(k?'L':'M')+xs(i)+','+ys(clampY(hi[i])));[...s].reverse().forEach(i=>d+='L'+xs(i)+','+ys(clampY(lo[i])));el('path',{d:d+'Z',fill:'#eef0f3'},svg);});}

function legendOf(spec){

  <div class="card"><h2><span class="step">3</span>What this looks like</h2><p class="sub">Reference examples, with this case drawn over each from its onset.</p>
    <div class="legend"><span><i class="sw" style="border-color:#4b5563"></i>Reference example</span><span><i class="sw" style="border-color:#0078d4"></i>This case</span></div>
    <div class="refs">${x.references.map((r,k)=>`<div class="ref ${r.verdict.kind==='match'?'best':''}"><div class="rt"><b>${esc(r.title)}</b><span class="tag">${esc(r.tag)}</span></div>
      <div class="desc">${esc(r.description)}</div>${r.charts.map((c,j)=>`<div class="ct">${esc(c.title)}</div><div class="chart" id="rf${k}_${j}"></div>`).join('')}
      <div class="cmp"><span class="m ${r.verdict.kind}">${r.verdict.kind==='match'?'✓':r.verdict.kind==='nomatch'?'✗':'≈'} ${esc(r.verdict.text)}</span><ul>${r.notes.map(n=>`<li>${esc(n)}</li>`).join('')}</ul></div></div>`).join('')}</div>
  </div>

  <div class="two${x.ruledOut.length?'':' flat'}"><div>
  ${x.ruledOut.length?`<div class="card"><h2><span class="step">4</span>What we ruled out</h2><p class="sub">Other causes of the same symptom, and why they don't fit.</p>
    ${x.ruledOut.map((r,k)=>`<div class="ro"><div class="q">${esc(r.cause)} <span class="x">${esc(r.verdict)}</span></div><div class="a">${esc(r.reason)}</div>${r.chart?`${legendOf(r.chart)}<div class="chart" id="ro${k}"></div>`:''}</div>`).join('')}
    ${x.excluded?`<div class="note">${esc(x.excluded)}</div>`:''}</div>`:''}
  </div><div>
  <div class="card"><h2><span class="step">${x.ruledOut.length?5:4}</span>How sure are we</h2>
    <div style="margin:4px 0 8px">${confBars(x.confidence.level)}<span class="conf"><span><b>${x.confidence.level==='n/a'?'Not applicable':cap(x.confidence.level)}</b></span></span></div>
    <dl class="kv"><dt>Because</dt><dd>${esc(x.confidence.because)}</dd>
      ${x.confidence.confirmedBy?`<dt class="up">Confirmed by</dt><dd>${esc(x.confidence.confirmedBy)}</dd>`:''}
      ${x.confidence.notHigherBecause?`<dt>Not higher because</dt><dd>${esc(x.confidence.notHigherBecause)}</dd>`:''}
      ${x.confidence.raiseIf?`<dt class="up">Raise if</dt><dd>${esc(x.confidence.raiseIf)}</dd>`:''}
      ${x.confidence.lowerIf?`<dt class="down">Lower if</dt><dd>${esc(x.confidence.lowerIf)}</dd>`:''}</dl></div>
  <div class="card"><h2><span class="step">${x.ruledOut.length?6:5}</span>What to do</h2><div class="a" style="font-size:12px;color:var(--ink2)">${esc(x.action.text)}</div>
    ${x.impact?`<div class="note">${esc(x.impact)}</div>`:''}
    ${works.map(w=>`<div class="work"><b>${esc(w.text)}${w.source==='ai'?'<span class="aipill">AI</span>':''}</b>${esc(w.assignedRole)} · ${w.done?'done '+esc((w.completedAt||'').slice(11,16)):'due '+esc((w.dueAt||'').slice(11,16))+' · not done'}</div>`).join('')}
    <div class="btnrow"><button class="btn pri">Create work item</button><button class="btn">This doesn't look right</button></div></div>
  ${dd.relatedOccurrences?.length?`<div class="card"><h2>Seen here before</h2>${dd.relatedOccurrences.map(o=>`<div class="ro"><div class="q">${esc(o.date)}</div><div class="a">${esc(o.summary)}</div></div>`).join('')}</div>`:''}
  </div></div>

  <details class="eng"><summary>How this detector works <span>for engineers: ${esc(det.summary)}</span></summary>
    <div class="pipe">${det.pipeline.map((b,i)=>(i?'<span class="arr">→</span>':'')+`<div class="blk"><b>${esc(b.title)}</b>${esc(b.text)}</div>`).join('')}</div>
    <div class="run">Ran on ${det.run.evaluated} ${esc(det.appliesTo)} on ${esc(det.run.date)}; raised on ${det.run.fired.length}: ${det.run.fired.map(f=>esc(f.label)+' at '+esc(f.at)).join(', ')}.${x.model?` Expected value: <code>${esc(x.model.formula)}</code>, fitted on ${esc(x.model.fittedOn)}.`:''}</div>
    <pre>${esc(JSON.stringify(det.definition,null,2))}</pre></details>
  <div class="foot">Preview · rendered from public/data/${esc(E.model)}/explanations.json, generated by ${esc(E.generatedBy)}</div>`;
  v.innerHTML=h;
  drawChart(document.getElementById('cMain'),x.chart,{height:240});
  x.checks.forEach((c,k)=>{if(c.spark) spark(document.getElementById('sp'+k),c.spark);});
  x.references.forEach((r,k)=>r.charts.forEach((c,j)=>drawChart(document.getElementById(`rf${k}_${j}`),c,{height:j===0?110:80,compact:true})));
  x.ruledOut.forEach((r,k)=>{if(r.chart) drawChart(document.getElementById('ro'+k),r.chart,{height:140,compact:true});});
  document.querySelector('.main').scrollTop=0;
}
function list(){
  const order={urgent:0,act:1,investigate:2,watch:3};
  const items=[...ITEMS].sort((a,b)=>order[a.attentionState]-order[b.attentionState]);
  document.getElementById('list').innerHTML=`<div class="zone">Attention · ${esc(E.model)}</div>`+items.map(a=>`<div class="it" data-id="${a.id}"><span class="dot" style="background:${SEV[a.severity]}"></span><div><div class="a">${esc(a.asset)}</div><div class="s">${esc(a.signal)}</div><div class="m">${STATE[a.attentionState]} · ${esc(a.since)}${E.items[a.id]?'':' · no explanation'}</div></div></div>`).join('');
  document.querySelectorAll('.it').forEach(n=>n.addEventListener('click',()=>{render(n.dataset.id);try{history.replaceState(null,'','#'+n.dataset.id);}catch(e){}}));
  const start=(location.hash||'').slice(1);
  render(ITEMS.some(a=>a.id===start)?start:items[0].id);
}
list();
let rt; addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{const s=document.querySelector('.it.sel');if(s)render(s.dataset.id);},150);});
</script>
</body>
</html>
